# Camada 5 — verificação independente. Corre num ambiente que o agente não controla.
# Mesmo que o agente contorne hooks locais (--no-verify), aqui não passa.
#
# Este workflow corre o código da branch do PR. Por isso as alterações a
# caminhos protegidos (scripts, configs, este próprio ficheiro) são verificadas
# à parte, a partir da base, em guard.yml — e precisam de review do code owner.
#
# Proteções obrigatórias no GitHub (Settings → Branches → main):
#   - Require pull request + 1 review + "Require review from Code Owners"
#   - Require status checks: check, diff-budget, protected-paths (guard.yml)
#   - Do not allow bypassing the above settings (inclui admins)
#   - Bloquear force-push

name: CI
on:
  pull_request:
    # labeled/unlabeled: a label diff-budget-override só tem efeito se o CI
    # voltar a correr quando ela é adicionada (o evento original não a tem).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

# Um run novo no mesmo PR (novo push, label) cancela o anterior: só o último
# conta. Nos pushes para main nunca se cancela: cada merge é verificado.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo: o passo "guardas mudaram?" compara com a base.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Proteções sincronizadas com .agent/protected-paths
        run: node scripts/protected-paths.mjs verify
      - run: npx prettier --check .
      - run: node scripts/validate-specs.mjs
      - run: npx tsc --noEmit
      - run: npx eslint src tests scripts .claude/hooks
      - run: npx vitest run
      # Corrida separada do contrato: se a config do vitest deixasse de incluir
      # tests/acceptance/, esta corrida falha com "No test files found".
      - name: Contrato (testes de aceitação)
        run: npx vitest run tests/acceptance
      # Os testes das guardas (~14 min) só podem mudar de resultado quando muda
      # uma guarda: um ficheiro "guardrail" de .agent/protected-paths. Num PR,
      # correm só nesse caso; num push para main, correm sempre (rede de
      # segurança). A lista e o matcher são os de scripts/protected-paths.mjs.
      - name: Guardas mudaram?
        id: guards
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "Push para main: os testes das guardas correm sempre."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only --no-renames "$BASE_SHA"...HEAD > "$RUNNER_TEMP/changed.txt"
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import { loadList, match } from './scripts/protected-paths.mjs';
            const list = loadList();
            const files = readFileSync(process.argv[1], 'utf8').split('\n').filter(Boolean);
            const guards = files.filter((f) => match(f, list)?.tier === 'guardrail');
            console.log(guards.length ? 'Guardas alteradas:\n  ' + guards.join('\n  ') : 'Nenhuma guarda alterada.');
            console.log('run=' + (guards.length > 0));
          " "$RUNNER_TEMP/changed.txt" | tee "$RUNNER_TEMP/guards.txt"
          grep '^run=' "$RUNNER_TEMP/guards.txt" >> "$GITHUB_OUTPUT"
      # Chromium antes das guardas: o test-guards corre um make check completo,
      # que inclui o contrato com browser (ADR 0005).
      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium
      - name: Testes das próprias guardas
        if: steps.guards.outputs.run == 'true'
        run: bash scripts/test-guards.sh
      # Contrato com browser (ADR 0005). O webServer da config sobe a app via
      # `make dev`; sem testes em tests/acceptance/e2e/ o Playwright falha.
      - name: Contrato com browser (Playwright + axe)
        run: npx playwright test
      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  diff-budget:
    name: diff-budget
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar orçamento
        env:
          DIFF_BUDGET_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'diff-budget-override') && '1' || '0' }}
        run: node scripts/check-diff-budget.mjs origin/${{ github.base_ref }}
